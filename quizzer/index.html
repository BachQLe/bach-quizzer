<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bach&#39;s Quizzer</title>
<link rel="stylesheet" href="katex/katex.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&family=Silkscreen&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f5f2ea;
    --ink-soft:rgba(245,242,234,.74);
    --ink-faint:rgba(245,242,234,.46);
    --glass:rgba(10,14,15,.55);
    --glass-strong:rgba(14,20,20,.6);
    --line:rgba(245,242,234,.18);
    --line-strong:rgba(245,242,234,.4);
    --sage:#a9e0b0;
    --sage-bg:rgba(169,224,176,.16);
    --clay:#f2a48b;
    --clay-bg:rgba(242,164,139,.16);
    --gold:#f3d77c;
    --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --px:"Silkscreen", "Courier New", monospace;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    font-family:var(--sans);font-weight:300;color:var(--ink);
    background:#13201f;overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  textarea{font:inherit;color:inherit}
  .px{font-family:var(--px);font-weight:400;letter-spacing:.04em;-webkit-font-smoothing:none}
  /* ---------- background ---------- */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#13201f}
  .bg-layer{position:absolute;inset:-4%;background-size:cover;background-position:center bottom;
    opacity:0;transition:opacity 1.8s var(--ease);transform:scale(1.04);
    animation:drift 40s ease-in-out infinite alternate}
  .bg-layer.pixel{image-rendering:pixelated;image-rendering:crisp-edges;animation:none;transform:none;inset:0}
  .bg-layer.on{opacity:1}
  @keyframes drift{from{transform:scale(1.04) translate3d(0,0,0)}to{transform:scale(1.12) translate3d(-1.5%,-1%,0)}}
  .veil{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      linear-gradient(180deg,rgba(6,10,10,.22) 0%,rgba(6,10,10,.12) 35%,rgba(6,10,10,.5) 100%),
      radial-gradient(120% 80% at 50% 60%,transparent 45%,rgba(0,0,0,.35) 100%)}
  .veil::before,.veil::after{content:"";position:absolute;inset:0;transition:opacity .4s ease}
  .veil::before{background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 1px,transparent 1px 3px)}
  .veil::after{background:rgba(6,10,10,.14);opacity:0}
  /* focus mode: calm the scene while answering / reviewing */
  .bgshuf,.credit,.keys{transition:opacity .2s ease}
  body.focus .bg-layer{animation-play-state:paused}
  body.focus .veil::before{opacity:0}
  body.focus .veil::after{opacity:1}
  body.focus #credit,body.focus #credit2,body.focus .keys{opacity:0;pointer-events:none}
  /* shuffle button stays reachable while answering: dimmed at rest, full on hover/focus */
  body.focus #bgshuf{opacity:.6}
  body.focus #bgshuf:hover,body.focus #bgshuf:focus-visible{opacity:1}
  @media (prefers-reduced-motion:reduce){.bg-layer{animation:none}.veil::before,.veil::after,.bgshuf,.credit,.keys{transition:none}}
  /* ---------- frame ---------- */
  .app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between;padding:20px 26px 0;
    font-family:var(--px);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
  .stage{--top:max(28px,9vh);flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:28px 22px 40px;overflow:hidden}
  .stage.anchored{align-items:flex-start;padding-top:var(--top)}
  .stage.inquiz{--top:max(68px,9vh)}
  .credit{position:fixed;left:24px;bottom:18px;z-index:3;font-family:var(--px);font-size:10px;letter-spacing:.04em;color:var(--ink-faint)}
  .credit a{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
  .credit a:hover{color:var(--ink-soft);border-color:var(--ink-faint)}
  .credit-r{left:auto;right:24px;color:rgba(245,242,234,.3);text-align:right}
  .keys{position:fixed;right:24px;bottom:18px;z-index:3;font-family:var(--px);font-size:10px;color:var(--ink-faint);letter-spacing:.04em}
  @media (max-width:640px){.toast{top:62px}.keys{display:none}.top{padding:16px 18px 0}.credit{left:16px;bottom:12px}.credit-r{left:auto;right:16px}}
  /* ---------- card: glass panel with sharp pixel corner brackets ---------- */
  .card{position:relative;display:flex;flex-direction:column;max-height:calc(100vh - var(--top,28px) - 40px);max-height:calc(100dvh - var(--top,28px) - 40px);width:min(680px,100%);background:var(--glass);border:1px solid var(--line);
    border-radius:0;padding:40px 44px 32px;
    -webkit-backdrop-filter:blur(30px) saturate(1.15);backdrop-filter:blur(30px) saturate(1.15);
    box-shadow:6px 6px 0 rgba(0,0,0,.28);
  }
  .card.enter{animation:rise .22s ease-out both}
  .card.swap .prompt,.card.swap .choices,.card.swap .short{animation:fade .12s ease-out both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .hub-row > .card.body.vfx > :not(.sbtog){animation:fade .12s ease-out backwards}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card::before,.card::after,.card .c3,.card .c4{content:"";position:absolute;width:14px;height:14px;pointer-events:none;
    border:0 solid var(--ink)}
  .card::before{top:-3px;left:-3px;border-top-width:3px;border-left-width:3px}
  .card::after{bottom:-3px;right:-3px;border-bottom-width:3px;border-right-width:3px}
  .card .c3{top:-3px;right:-3px;border-top-width:3px;border-right-width:3px}
  .card .c4{bottom:-3px;left:-3px;border-bottom-width:3px;border-left-width:3px}
  .card.wide{width:min(760px,100%)}
  /* question card: identical size on every question so Next never moves (spam-click friendly) */
  .card.q{width:min(680px,100%);box-sizing:border-box;
    height:min(680px,calc(100vh - var(--top,28px) - 40px));height:min(680px,calc(100dvh - var(--top,28px) - 40px))}
  .card.q > .q-scroll{flex:1 1 auto;min-height:0}
  @media (max-width:640px){.card{padding:28px 22px 22px}}
  .eyebrow{font-family:var(--px);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
  h1{font-family:var(--serif);font-weight:500;font-size:clamp(34px,5vw,48px);line-height:1.08;margin:14px 0 10px;letter-spacing:-.005em}
  .lede{color:var(--ink-soft);font-size:15px;line-height:1.65;font-weight:400;max-width:65ch}
  /* buttons: square, pixel type, hard shadow that presses in */
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .spacer{flex:1}
  .btn{font-family:var(--px);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    padding:10px 16px;border:2px solid var(--line-strong);border-radius:0;
    background:rgba(245,242,234,.04);box-shadow:3px 3px 0 rgba(0,0,0,.35);
    transition:background .15s, border-color .15s, color .15s}
  .btn:hover{background:rgba(245,242,234,.1);border-color:rgba(245,242,234,.6)}
  .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 rgba(0,0,0,0)}
  .btn.primary{background:var(--ink);color:#14201f;border-color:var(--ink)}
  .btn.primary:hover{background:#fff;border-color:#fff}
  .btn.ghost{border-color:transparent;background:none;box-shadow:none;color:var(--ink-soft)}
  .btn.ghost:hover{color:var(--ink);background:rgba(245,242,234,.07)}
  .btn.ghost:active{transform:none}
  .btn:disabled{opacity:.3;pointer-events:none}
  .btn:focus-visible,.choice:focus-visible,.rv-item:focus-visible,.pill:focus-visible{outline:2px dashed var(--gold);outline-offset:3px}
  /* progress: square segments; arrow above the current one, bookmark below flagged ones */
  .progress{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-start;max-width:346px;min-width:0}
  .seg{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  .seg .dot{width:10px;height:10px;background:rgba(245,242,234,.16);border:1px solid rgba(245,242,234,.28);transition:background .15s}
  .seg.done .dot{background:rgba(245,242,234,.72);border-color:rgba(245,242,234,.72)}
  .seg.now .dot{background:var(--ink);border-color:var(--ink)}
  .seg:hover .dot{border-color:var(--ink)}
  .seg .arr,.seg .bm{display:block;visibility:hidden;shape-rendering:crispEdges}
  .seg .arr{width:10px;height:6px;color:var(--ink)}
  .seg .bm{width:8px;height:10px;color:var(--gold)}
  .seg.now .arr,.seg.flag .bm{visibility:visible}
  /* question */
  .q-head,.q-foot{flex:none}
  .q-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:24px}
  .q-num{font-family:var(--px);font-size:13px;letter-spacing:.06em;color:var(--ink-soft);padding-top:7px}
  .q-num b{color:var(--ink);font-weight:400}
  .q-num .nb{position:relative;display:inline-block;padding:4px 0;margin:-4px 0;overflow:hidden;vertical-align:bottom}
  .q-num .nb > b{display:inline-block}
  .q-num .nb > b.ng{position:absolute;left:0;top:4px;pointer-events:none}
  .prompt,.res-q,.rv-a,h1{font-variant-numeric:lining-nums}
  .prompt{font-family:var(--serif);font-weight:500;font-size:clamp(24px,3.4vw,31px);line-height:1.28;margin-bottom:24px;white-space:pre-wrap}
  .katex{font-size:1.04em}
  .katex-display{margin:.6em 0;overflow-x:auto;overflow-y:hidden}
  .qtable{overflow-x:auto;margin:-6px 0 22px;white-space:normal;max-width:100%}
  .qtable table{border-collapse:collapse;font-family:var(--sans,Inter,system-ui,sans-serif);font-size:15px;line-height:1.35;background:rgba(0,0,0,.2)}
  .qtable th,.qtable td{border:1px solid var(--line);padding:7px 14px;text-align:left;font-weight:400;font-variant-numeric:tabular-nums}
  .qtable th{background:rgba(245,242,234,.1);font-family:var(--px);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
  .res-q .qtable{margin:8px 0 2px}
  .res-q .qtable table{font-size:13px}
  .prompt code,.ans code{font-family:ui-monospace,Menlo,monospace;font-size:.78em;background:rgba(0,0,0,.28);padding:1px 6px}
  .q-scroll{min-height:0;overflow:auto;margin:0 -8px 0 -18px;padding:4px 8px 4px 18px;scrollbar-width:thin;scrollbar-color:rgba(245,242,234,.4) transparent}
  .q-scroll::-webkit-scrollbar{width:6px}
  .q-scroll::-webkit-scrollbar-thumb{background:rgba(245,242,234,.4)}
  .q-scroll .prompt{margin-bottom:24px}
  .choices{display:flex;flex-direction:column;gap:10px}
  .choice{display:flex;align-items:flex-start;gap:16px;text-align:left;padding:14px 18px;border-radius:0;
    border:1px solid var(--line);background:rgba(245,242,234,.035);transition:background .1s, border-color .1s;font-size:16.5px;font-weight:400;line-height:1.45;position:relative}
  .choice:hover{background:rgba(245,242,234,.09);border-color:var(--line-strong)}
  .choice:hover::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-5px;
    border-left:6px solid var(--ink);border-top:5px solid transparent;border-bottom:5px solid transparent}
  .choice .k{flex:none;width:24px;height:24px;border:2px solid var(--line-strong);
    display:grid;place-items:center;font-family:var(--px);font-size:11px;color:var(--ink-soft);margin-top:-1px;
    transition:background .1s,color .1s,border-color .1s}
  .choice.sel{background:rgba(245,242,234,.16);border-color:rgba(245,242,234,.7);box-shadow:inset 3px 0 0 var(--ink)}
  .choice.sel .k{background:var(--ink);color:#14201f;border-color:var(--ink)}
  /* cross-out (process of elimination) */
  .opt{position:relative;display:flex}
  .opt .choice{flex:1;min-width:0;padding-right:56px}
  .xbtn{position:absolute;right:12px;top:12px;z-index:1;width:28px;height:28px;display:grid;place-items:center;font-family:var(--px);font-size:12px;line-height:1;color:var(--ink-faint);border:2px solid var(--line);background:rgba(245,242,234,.03);transition:color .1s,border-color .1s,background .1s}
  .xbtn svg{width:15px;height:15px;display:block;shape-rendering:crispEdges}
  .xbtn:hover{color:var(--clay);border-color:var(--clay)}
  .xbtn.on{color:var(--clay);border-color:var(--clay);background:var(--clay-bg)}
  .xbtn:focus-visible{outline:2px dashed var(--gold);outline-offset:2px}
  .opt.out .choice{opacity:.78}
  .opt.out .choice{cursor:not-allowed}
  .opt.out .choice:hover{background:rgba(245,242,234,.035);border-color:var(--line)}
  .opt.out .choice:hover::before{display:none}
  .opt.out .choice .t{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--clay)}
  .opt.out .choice .k{border-style:dashed}
  /* hourglass timer */
  .qtime{display:flex;align-items:center;justify-content:center;align-self:stretch;padding:0 11px;border-left:1px solid var(--line);color:var(--ink-soft)}
  .qtime:hover{background:rgba(245,242,234,.1);color:var(--ink)}
  .qtime.on{color:var(--gold)}
  .qtime:focus-visible{outline:2px dashed var(--gold);outline-offset:-2px}
  .qtime svg{width:11px;height:14px;display:block;shape-rendering:crispEdges}
  .hg{width:11px;height:14px;display:inline-block;vertical-align:-2px;margin-right:6px;shape-rendering:crispEdges}
  .qclock{display:flex;align-items:center;gap:9px;padding:0 12px 0 2px;font-family:var(--px);font-size:11px;letter-spacing:.06em;color:var(--ink);white-space:nowrap;overflow:hidden;max-width:240px;opacity:1;transition:max-width .3s cubic-bezier(.22,.8,.3,1),padding .3s cubic-bezier(.22,.8,.3,1),opacity .22s ease}
  .qclock.collapsed{max-width:0;padding-left:0;padding-right:0;opacity:0;pointer-events:none}
  @media (prefers-reduced-motion:reduce){.qclock{transition:none}}
  .qclock em{font-style:normal;font-size:10px;color:var(--ink-faint)}
  .qcalc svg{width:11px;height:13px}
  /* confidence toggle + per-question rating */
  .qconf{font-family:var(--px);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
  .conf-row{flex:none;display:none;flex-direction:column;align-items:flex-start;gap:8px;margin-top:18px}
  body.conf .conf-row{display:flex}
  .conf-l{font-family:var(--px);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
  .conf-btns{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill.cf{transition:background .1s,color .1s,border-color .1s}
  .pill.cf.on{background:rgba(243,215,124,.14);border-color:var(--gold);color:var(--gold)}
  .ans dd.conf{font-family:var(--px);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);padding-top:2px}
  .ans dd.conf.flag{color:var(--clay)}
  /* scheduled (spaced) quizzes: a countdown to when it's ready; it can be opened early */
  .qc-lock{display:flex;align-items:center;gap:7px;font-family:var(--px);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
  .qc-lock b{font-weight:400;font-size:18px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
  /* calculator */
  .calc{position:fixed;right:16px;bottom:16px;z-index:5;width:232px;padding:0 0 12px;background-color:rgba(14,20,20,.84);border:2px solid var(--line-strong);box-shadow:5px 5px 0 rgba(0,0,0,.4);-webkit-backdrop-filter:blur(30px) saturate(1.15);backdrop-filter:blur(30px) saturate(1.15)}
  .calc-h{display:flex;align-items:center;justify-content:space-between;padding:7px 8px 7px 12px;border-bottom:1px solid var(--line);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--px);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
  .calc-h:active{cursor:grabbing}
  .calc-x{width:22px;height:22px;display:grid;place-items:center;font-family:var(--px);font-size:11px;color:var(--ink-faint)}
  .calc-x:hover{color:var(--clay)}
  .calc-hist{height:14px;margin:10px 12px 0;text-align:right;font-family:var(--px);font-size:10px;letter-spacing:.04em;color:var(--ink-faint);overflow:hidden;white-space:nowrap}
  .calc-in{display:block;width:calc(100% - 24px);margin:3px 12px 10px;padding:6px 8px;text-align:right;font-family:var(--px);font-size:20px;letter-spacing:.04em;color:var(--ink);background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:0;outline:none;caret-color:var(--sage)}
  .calc-in:focus{border-color:var(--line-strong)}
  .calc-g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 12px}
  .ck{height:36px;font-family:var(--px);font-size:14px;color:var(--ink);border:2px solid var(--line-strong);background:rgba(245,242,234,.04);box-shadow:2px 2px 0 rgba(0,0,0,.35);transition:background .12s}
  .ck:hover{background:rgba(245,242,234,.12)}
  .ck:active{transform:translate(2px,2px);box-shadow:none}
  .ck.op{color:var(--gold)}
  .ck.eq{background:var(--ink);color:#14201f;border-color:var(--ink)}
  .ck.eq:hover{background:#fff}
  .ck:focus-visible,.calc-x:focus-visible{outline:2px dashed var(--gold);outline-offset:2px}
  .short{width:100%;min-height:120px;resize:vertical;padding:14px 16px;border-radius:0;border:1px solid var(--line);
    background:rgba(0,0,0,.2);font-size:16px;font-weight:400;line-height:1.5;outline:none;caret-color:var(--sage)}
  .short:focus{border-color:var(--line-strong)}
  .short.frq{min-height:240px}
  .frq-meta{font-family:var(--px);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 8px}
  .q-foot{margin-top:32px}
  .flag-btn{display:inline-flex;align-items:center;gap:7px}
  .flag-btn.on{color:var(--gold)}
  .bm-ico{width:8px;height:10px;shape-rendering:crispEdges}
  .flag-btn:not(.on) .bm-ico{opacity:.5}
  /* review */
  .rv-list{margin:22px 0 26px;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:auto;padding-right:4px}
  .rv-item{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:baseline;text-align:left;
    padding:12px 14px;border-radius:0;border:1px solid transparent;transition:background .15s}
  .rv-item:hover{background:rgba(245,242,234,.07);border-color:var(--line)}
  .rv-n{font-family:var(--px);font-size:11px;color:var(--ink-faint)}
  .rv-q{font-size:14px;color:var(--ink-soft);line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
  .rv-a{font-family:var(--serif);font-size:17px;margin-top:2px;color:var(--ink)}
  .rv-a.none{color:var(--clay);font-style:italic}
  .rv-flag{font-family:var(--px);color:var(--gold);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
  /* results */
  .score{font-family:var(--px);font-weight:400;font-size:clamp(56px,9vw,84px);line-height:1;letter-spacing:-.02em;text-shadow:3px 3px 0 rgba(0,0,0,.35)}
  .score small{font-size:.4em;color:var(--ink-soft);margin-left:6px;text-shadow:none}
  .xp{display:flex;gap:3px;margin-top:14px}
  .xp i{width:16px;height:8px;background:rgba(245,242,234,.14)}
  .xp i.ok{background:var(--sage)} .xp i.no{background:var(--clay)} .xp i.pend{background:var(--gold)}
  .xp.fill i{animation:xpfill .24s ease-out both;animation-delay:calc(var(--n,0) * 40ms)}
  @keyframes xpfill{from{background:rgba(245,242,234,.14)}}
  .res.quiet .res-q,.res.quiet .ans{opacity:.82}
  /* dropped questions: removed from the score, grayed out, still listed so they can be restored */
  .xp i.drop{background:rgba(245,242,234,.07)}
  .res.dropped{border-color:var(--line);border-left-color:rgba(245,242,234,.22);background:rgba(0,0,0,.08)}
  .res.dropped .res-top{opacity:.4;filter:grayscale(1)}
  .res.dropped .res-q{text-decoration:line-through;text-decoration-color:rgba(245,242,234,.4)}
  .res.dropped .res-mark{color:var(--ink-faint)}
  .res.dropped .self{margin-top:10px}
  .res-more{margin:12px 0 0 30px}
  .res-more > summary{cursor:pointer;list-style:none;font-family:var(--px);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);display:inline-block;padding:2px 0}
  .res-more > summary::-webkit-details-marker{display:none}
  .res-more > summary::before{content:"+";display:inline-block;width:1.4em}
  .res-more[open] > summary::before{content:"\2212"}
  .res-more > summary:hover{color:var(--ink-soft)}

<script>
(() => {
  "use strict";
  const LETTERS = "ABCDEFGH";
  const $ = (s, r = document) => r.querySelector(s);
  const stage = $("#stage");

  /* ---------------- helpers ---------------- */
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  // light inline formatting: `code` and **bold**
  const tblHtml = t => !t || !t.rows || !t.rows.length ? "" : `<div class="qtable"><table>${t.headers && t.headers.length ? `<thead><tr>${t.headers.map(h => `<th>${fmt(h)}</th>`).join("")}</tr></thead>` : ""}<tbody>${t.rows.map(r => `<tr>${r.map(c => `<td>${fmt(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  const tblText = t => !t || !t.rows || !t.rows.length ? [] : [(t.headers && t.headers.length ? [t.headers] : []).concat(t.rows).map(r => "   | " + r.join(" | ") + " |").join("\n")];
  const fmtBasic = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\\\$/g, "$");
  const MATH_RE = /(`[^`\n]+`)|\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|(?<![\\$\d])\$(?![\s$])((?:\\.|[^$\\\n])+?)(?<![\s\\])\$(?!\d)/g;
  const texOut = (tex, display) => { try { if (window.katex) return katex.renderToString(tex, {displayMode:display, throwOnError:false}); } catch (e) {} return esc(tex); };
  // fmt is memoized: KaTeX is the slowest part of every re-render (results regrades, review list, hub). Only cached once KaTeX
  // has loaded, so a fallback rendering of raw TeX is never kept.
  const fmtMemo = new Map();
  const fmt = s => {
    s = String(s ?? "");
    const hit = fmtMemo.get(s); if (hit !== undefined) return hit;
    const out = fmtRaw(s);
    if (window.katex || !/[$\\]/.test(s)){ if (fmtMemo.size > 4000) fmtMemo.clear(); fmtMemo.set(s, out); }
    return out;
  };
  const fmtRaw = s => {
    let out = "", last = 0, m; MATH_RE.lastIndex = 0;
    while ((m = MATH_RE.exec(s))){
      out += fmtBasic(s.slice(last, m.index));
      if (m[1]) out += fmtBasic(m[1]);
      else if (m[2] != null) out += texOut(m[2], true);
      else if (m[3] != null) out += texOut(m[3], true);
      else if (m[4] != null) out += texOut(m[4], false);
      else out += texOut(m[5], false);
      last = m.index + m[0].length;

    return out + fmtBasic(s.slice(last));
  };
  // safety net: an answer choice written as bare LaTeX (e.g. \frac{1}{2}, \eta^2) with no $ or \( \) delimiters is rendered as math
  const wrapChoiceMath = q => {
    q.questions.forEach(it => { if (it.choices) it.choices = it.choices.map(c => /\\[a-zA-Z]{2,}/.test(c) && !/\$|\\\(|\\\[|`/.test(c) ? "$" + c.trim() + "$" : c); });
    return q;
  };
  const store = {
    get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

  const reducedMotion = () => !!(window.matchMedia && matchMedia("(prefers-reduced-motion:reduce)").matches);
  const norm = s => String(s ?? "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();

  /* ---------------- backgrounds ---------------- */
  let photos = [], order = [], photoIdx = -1, layerOn = "A";
  async function loadPhotos(){
    try {
      const r = await fetch("img/photos.json", {cache:"no-store"});
      if (r.ok) {
        const j = await r.json();
        photos = Array.isArray(j.photos) ? j.photos.filter(p => p && p.file) : [];
      }
    } catch {}
    shufflePhotos();
    pickBackground();
  }
  function shufflePhotos(){
    order = photos.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    photoIdx = -1;
  }
  // Fallback when no bundled photos: a generated pixel-art landscape (low-res canvas, scaled up crisp).
  // palette: [skyTop, skyBottom, sun, far, mid, near, front, accent]
  const PALETTES = [
    { name:"jungle night", c:["#0b1f22","#2c5d55","#d9f2c4","#24504a","#1a3e3a","#11302c","#0a1e1c","#7fd6b0"], stars:true, moon:true },
    { name:"dusk",         c:["#2e2440","#d08c78","#ffe6b3","#8a6a80","#5f4a66","#3e3049","#231a2d","#ffb48a"], stars:false },
    { name:"dawn",         c:["#1d2b46","#a7bfd6","#fff2d6","#6f87a6","#4f6482","#34465e","#1c2638","#ffd9a8"], stars:false },
    { name:"golden",       c:["#3f3424","#e6b56f","#fff3c4","#a9865a","#7d6344","#544330","#2e251a","#ffe08a"], stars:false },
    { name:"mist",         c:["#24342e","#a8c4a6","#f4f7e6","#7c9c84","#5a7663","#3b5244","#1f2d25","#e8f5d0"], stars:false },
    { name:"violet night", c:["#120f26","#4a3a78","#e9e3ff","#3b3166","#2b2550","#1d1a3a","#110f24","#b8a6ff"], stars:true, moon:true }
  ];
  const hex = h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const rgb = a => `rgb(${a[0]},${a[1]},${a[2]})`;
  function pixelScene(){
    const P = PALETTES[Math.floor(Math.random() * PALETTES.length)], c = P.c;
    const W = 320, H = 200, cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    const g = cv.getContext("2d");
    const R = (a, b) => a + Math.random() * (b - a);
    // sky: stepped bands with checkerboard dithering between them
    const top = hex(c[0]), bot = hex(c[1]), STEPS = 9, skyH = H * 0.78;
    for (let y = 0; y < H; y++){
      const t = Math.min(1, y / skyH) * (STEPS - 1), lo = Math.floor(t), f = t - lo;
      for (let x = 0; x < W; x++){
        const s = (f > 0.5 && (x + y) % 2 === 0) || f > 0.85 ? lo + 1 : lo;
        g.fillStyle = rgb(mix(top, bot, Math.min(STEPS - 1, s) / (STEPS - 1)));
        g.fillRect(x, y, 1, 1);
      }
    }
    // stars
    if (P.stars) for (let i = 0; i < 70; i++){
      const x = R(0, W) | 0, y = R(0, H * 0.45) | 0;
      g.fillStyle = Math.random() < .2 ? "#ffffff" : "rgba(255,255,255,.55)"; g.fillRect(x, y, 1, 1);
      if (Math.random() < .06){ g.fillRect(x - 1, y, 3, 1); g.fillRect(x, y - 1, 1, 3); }
    }
    // sun / moon as a pixel disc with a halo ring
    const sx = R(W * .15, W * .85) | 0, sy = R(H * .14, H * .32) | 0, sr = P.moon ? 9 : 13;
    for (let y = -sr - 4; y <= sr + 4; y++) for (let x = -sr - 4; x <= sr + 4; x++){
      const d = Math.sqrt(x * x + y * y);
      if (d <= sr) { g.fillStyle = c[2]; g.fillRect(sx + x, sy + y, 1, 1); }
      else if (d <= sr + 4 && (x + y) % 2 === 0) { g.fillStyle = "rgba(255,255,255,.12)"; g.fillRect(sx + x, sy + y, 1, 1); }
    }
    if (P.moon){ g.fillStyle = rgb(mix(top, bot, .3)); for (let y = -sr; y <= sr; y++) for (let x = -sr; x <= sr; x++) if ((x + 4) ** 2 + (y - 2) ** 2 <= (sr - 1) ** 2 && x * x + y * y <= sr * sr) g.fillRect(sx + x + 0, sy + y, 1, 1); }
    // clouds: chunky pixel blobs
    for (let k = 0; k < 4; k++){
      const cx = R(-20, W) | 0, cy = R(H * .12, H * .42) | 0, w = R(24, 52) | 0;
      g.fillStyle = "rgba(255,255,255,.10)";
      g.fillRect(cx, cy, w, 3); g.fillRect(cx + 5, cy - 3, w - 14, 3); g.fillRect(cx + 12, cy - 5, (w - 26) > 4 ? w - 26 : 6, 2);
    }
    // mountain ridges, far to near, each with a mist row above its base
    const ridge = (base, amp, col, seed, rough) => {
      for (let x = 0; x < W; x++){
        const y = base - amp * (0.6 * Math.sin((x + seed) / 38) + 0.3 * Math.sin((x + seed * 2) / 15) + rough * Math.sin((x + seed * 3) / 5));
        g.fillStyle = col; g.fillRect(x, Math.round(y), 1, H);
      }
    };
    const layers = [[H * .58, 22, c[3], .08], [H * .68, 18, c[4], .1], [H * .78, 12, c[5], .12]];
    layers.forEach(([b, a, col, r], i) => {
      ridge(b, a, col, R(0, 999), r);
      g.fillStyle = "rgba(255,255,255,.06)";
      for (let x = 0; x < W; x += 2) g.fillRect(x + (i % 2), Math.round(b + 6), 1, 1);
    });
    // front: water with reflection streaks, or a pine forest
    const front = Math.round(H * .86);
    if (Math.random() < .5){
      g.fillStyle = c[6]; g.fillRect(0, front, W, H - front);
      g.fillStyle = c[2];
      for (let y = front + 2; y < H; y += 3){ const w = R(4, 16) | 0; g.globalAlpha = .35 * (1 - (y - front) / (H - front)); g.fillRect(sx - w / 2 + R(-4, 4), y, w, 1); }
      g.globalAlpha = 1;
    } else {
      g.fillStyle = c[6]; g.fillRect(0, front, W, H - front);
      for (let x = -4; x < W + 4; x += R(5, 11) | 0){
        const h = R(14, 30) | 0, bx = x, by = front + 2;
        for (let j = 0; j < h; j++){ const w = Math.max(1, Math.round((j / h) * 7 * ((j % 4) < 2 ? 1 : .75))); g.fillRect(bx - w, by - h + j, w * 2 + 1, 1); }

    }
    // a few fireflies / sparkles in the accent colour

    for (let i = 0; i < 12; i++) g.fillRect(R(0, W) | 0, R(H * .6, H * .95) | 0, 1, 1);
    return cv.toDataURL("image/png");
  }
  function setLayer(src, pixel, pos){
    const on = layerOn === "A" ? $("#bgB") : $("#bgA");
    const off = layerOn === "A" ? $("#bgA") : $("#bgB");
    on.style.backgroundImage = `url("${src}")`;
    on.style.backgroundPosition = pos || "";
    on.classList.toggle("pixel", !!pixel);
    on.classList.add("on"); off.classList.remove("on");
    layerOn = layerOn === "A" ? "B" : "A";
  }

  let bgChosen = false;   // one background per page load unless the user shuffles
  let bgTok = 0;
  // Shuffle button: next photo in the shuffled order (never the one showing); new pixel scene if no photos
  function shuffleBackground(){
    if (!photos.length){ bgTok++; setLayer(pixelScene(), true); $("#credit").textContent = ""; $("#credit2").textContent = ""; return; }
    if (photos.length > 1 && photoIdx + 1 >= order.length){
      const cur = order[photoIdx]; shufflePhotos();
      if (order[0] === cur) [order[0], order[order.length - 1]] = [order[order.length - 1], order[0]];

        : "";
      // optional faint credit in the bottom-right corner (photos.json "credit" + "creditLink")
      $("#credit2").innerHTML = p.credit
        ? (p.creditLink ? `<a href="${esc(p.creditLink)}" target="_blank" rel="noopener">${esc(p.credit)}</a>` : esc(p.credit))
        : "";
      // warm the next one
      const n = photos[order[(photoIdx + 1) % order.length]];
      if (n) { const pre = new Image(); pre.src = "img/" + n.file; }
    };
    img.src = src;
  }

  /* ---------------- state ---------------- */
  let db = null;
  let quiz = null;          // active quiz object
  let pending = null;       // newer quiz waiting behind the toast
  let st = null;            // {quizId, view, i, answers[], flags[], self[], revealedAt}
  let lastSeenId = store.get("zq:lastSeen");
  let clockOn = store.get("zq:clock") === true, lastTick = null; let calcOn = false, calcJust = false;   // timer reveal toggle; last tick timestamp
  let confOn = store.get("zq:conf") !== false;   // confidence rating: on unless switched off from the top bar
  const CONF = [[1, "Guess"], [2, "Unsure"], [3, "Sure"]], CONF_NAME = {1:"guess", 2:"unsure", 3:"sure"};
  let library = [];            // saved quizzes from the db, newest first
  let resultsById = {};        // results docs, keyed by results doc id
  let filter = store.get("zq:filter") || "all";
  let confirmDel = null;       // docId awaiting delete confirmation
  let booting = true;          // until the library has loaded (or db is unavailable)
  let startedUp = false, libConfirmed = false, resConfirmed = false;
  const seen = new Set(store.get("zq:seen") || []);
  const markSeen = id => { seen.add(id); store.set("zq:seen", [...seen].slice(-400)); };

  function blankState(q){
    const n = q.questions.length;
    return { quizId:q.id, view:"intro", i:0, answers:Array(n).fill(null), flags:Array(n).fill(false), self:Array(n).fill(null), rub:Array.from({length:n}, () => []), conf:Array(n).fill(null), cross:Array.from({length:n}, () => []), dropped:Array(n).fill(false), times:Array(n).fill(0), reviewMs:0, revealedAt:null };
  }
  function save(){ if (st) store.set("zq:state:" + st.quizId, st); }

  /* ---------------- timer ---------------- */
  const pad2 = n => String(n).padStart(2, "0");
  function fmtT(ms){
    const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
    return h ? `${h}:${pad2(m)}:${pad2(r)}` : `${m}:${pad2(r)}`;
  }
  const totalMs = s => (s.times || []).reduce((a, b) => a + (b || 0), 0) + (s.reviewMs || 0);
  // credit the time since the last tick to the question (or review screen) being viewed; paused while the tab is hidden
  function addTime(){
    const now = Date.now();

  function updateClock(){

     cdn.jsdelivr.net/npm/ are allowed, so each release also publishes the npm package "bach-quizzer", whose latest.js
     only sets window.__bqLatest = {version, released, notes[]}. Checked once per page load. The dialog shows on the hub
     only, never while a quiz is open. Later hides it for this load; Skip this version stores zq:updSkip.
     If the script can't load (no npm release yet, offline), nothing happens. */
  const BQ_VERSION = "1.1.0";
  const BQ_REPO = "https://github.com/BachQLe/bach-quizzer";
  const BQ_ZIP = BQ_REPO + "/releases/latest/download/bachs-quizzer.zip";
  const BQ_LATEST_JS = "https://cdn.jsdelivr.net/npm/bach-quizzer@latest/latest.js";
  let updInfo = null, updShown = false;
  const verParts = v => String(v).split(".").map(n => parseInt(n, 10) || 0);
  const verNewer = (a, b) => { const x = verParts(a), y = verParts(b); for (let i = 0; i < 3; i++){ if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; };
  const updMsg = v => `Update my Quizzer to v${v}. I uploaded the new bachs-quizzer skill zip.`;
  function checkUpdates(){
    try {
      const s = document.createElement("script");
      s.src = BQ_LATEST_JS; s.async = true;
      s.onload = () => {
        const L = window.__bqLatest;
        if (!L || typeof L.version !== "string" || !/^\d+\.\d+\.\d+$/.test(L.version) || !verNewer(L.version, BQ_VERSION)) return;
        updInfo = {version: L.version, notes: Array.isArray(L.notes) ? L.notes.filter(n => typeof n === "string").slice(0, 6) : []};
        maybeShowUpdate();
      };
      s.onerror = () => {};
      document.head.appendChild(s);
    } catch (e) {}
  }
  function maybeShowUpdate(){
    if (!updInfo || updShown || quiz || booting) return;
    if (store.get("zq:updSkip") === updInfo.version) return;
    updShown = true;
    const v = updInfo.version;
    let el = $("#upd");
    if (!el){ el = document.createElement("div"); el.id = "upd"; el.className = "upd-scrim"; document.body.appendChild(el); }
    el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true"); el.setAttribute("aria-labelledby", "updT");
    el.innerHTML = `<div class="card upd enter"><i class="c3"></i><i class="c4"></i>
      <div class="eyebrow">Update · v${esc(BQ_VERSION)} → v${esc(v)}</div>
      <h2 id="updT">A new Quizzer is out</h2>
      ${updInfo.notes.length ? `<ul class="upd-notes">${updInfo.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}
      <ol class="upd-steps">
        <li><a href="${BQ_ZIP}" target="_blank" rel="noopener">Download the update</a> (bachs-quizzer.zip).</li>
        <li>In Claude, open Settings → Capabilities → Skills and upload the zip. It replaces your old Bach's Quizzer skill.</li>
        <li>Copy this message and send it to Claude in a new chat:</li>
      </ol>
      <div class="upd-msg" id="updMsg">${esc(updMsg(v))}</div>
      <div class="upd-row"><button class="btn primary" id="updCopy" type="button">Copy message</button><button class="btn ghost" id="updLater" type="button">Later</button><button class="btn ghost" id="updSkip" type="button">Skip this version</button></div>
      <p class="upd-note" id="updNote"></p></div>`;
    el.classList.add("on");
    const close = () => { el.classList.remove("on"); document.removeEventListener("keydown", onKey, true); };
    const onKey = e => { if (e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); close(); } else if (!e.target.closest || !e.target.closest("#upd")) e.stopPropagation(); };
    document.addEventListener("keydown", onKey, true);

    $("#updSkip").onclick = () => { store.set("zq:updSkip", v); close(); };
    $("#updCopy").onclick = async () => {
      try { await navigator.clipboard.writeText(updMsg(v)); $("#updCopy").textContent = "Copied!"; $("#updNote").textContent = "Paste it into a chat with Claude after you upload the zip."; }
      catch (e) { $("#updNote").textContent = "Couldn't copy here. Select the message above and copy it."; }
    };

  }

  /* ---------------- toast ---------------- */
  function showToast(msg){ $("#toastMsg").textContent = msg; $("#toast").classList.add("on"); }
  function hideToast(){ $("#toast").classList.remove("on"); }
  $("#toastGo").onclick = () => { if (pending){ const q = pending; pending = null; adopt(q); } };
  $("#toastX").onclick = hideToast;

  /* ---------------- grading ---------------- */
  function rightOf(q, s, k){
    const item = q.questions[k], a = s.answers[k];
    if (item.type === "mc") return a === item.answer;
    if (item.type === "graph"){ if (s.self[k] === true) return true; if (s.self[k] === false) return false; return a && Array.isArray(a.s) && a.s.length ? null : false; }   // drawn graphs are self-graded
    if (s.self[k] === true) return true;
    if (s.self[k] === false) return false;
    if (a == null || a === "") return false;
    if (item.type === "frq") return null;   // free response: only he can grade it, against the rubric
    const accepted = [item.answer, ...(item.accept || [])].map(norm).filter(Boolean);
    return accepted.includes(norm(a)) ? true : null; // null = needs self-check
  }
  const isDrop = (s, k) => !!(s && s.dropped && s.dropped[k]);   // dropped from the quiz while grading: not scored, not saved
  function tallyOf(q, s){
    let right = 0, pend = 0, total = 0;
    q.questions.forEach((_, k) => { if (isDrop(s, k)) return; total++; const r = rightOf(q, s, k); if (r === true) right++; else if (r === null) pend++; });
    return { right, pend, total };
  }
  const isRight = k => rightOf(quiz, st, k);
  const tally = () => tallyOf(quiz, st);
  function answerText(k, a){
    const q = quiz.questions[k];
    if (a == null || a === "") return null;
    return q.type === "mc" ? `${LETTERS[a]}. ${q.choices[a]}` : q.type === "graph" ? gSummary(a) : String(a);
  }

  /* ---------------- graph questions: draw it, then compare with the real graph ----------------
     question: {type:"graph", prompt, answer:"words", explanation, graph:{xMin,xMax,yMin,yMax,xStep,yStep,xLabel,yLabel,letters?:["A","B","C"],
                 given:{curves,dots,vlines,hlines}, answer:{curves,dots,vlines,hlines}}}
     curve = {fn:"(x-2)^2-1", domain:[a,b], dash:true, arrows?:"end"|"start"|"both"} or {points:[[x,y],...]}; dot = {x,y,open,label?} (label = a point letter like "A", up to 4 chars, drawn beside the dot); texts = [{x,y,label}] (plain text centred at x,y with NO point, up to 4 chars: "B", "SE", "IE"); vlines/hlines = numbers
     his answer is st.answers[k] = {s:[{t:"pen"|"line"|"dot"|"odot"|"text", p:[[x,y],...], l?:"A"}]} in graph coordinates (t:"text" = a label placed with the Text tool: just text, no point; older answers may hold a dot with l + lp, ar = "end"|"both" arrowheads on a line); the Text tool only offers the question's labels (graph.letters, or else the labels on the answer dots and texts) and is hidden when there are none; self-graded like a written answer */
  const G_NAMES = ["asin","acos","atan","floor","ceil","sign","cbrt","sqrt","sin","cos","tan","abs","exp","log","ln","pi","x","e"];
  const G_FN = {sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,sqrt:Math.sqrt,cbrt:Math.cbrt,abs:Math.abs,exp:Math.exp,ln:Math.log,log:Math.log10,floor:Math.floor,ceil:Math.ceil,sign:Math.sign};
  const G_COL = {ink:"#f5f2ea", sage:"#a9e0b0", given:"#8ec5ff", gold:"#f3d77c", bg:"#162221"};
  const gFnCache = new Map();
  let gTool = "pen", gSnap = true, gHook = null, gFitFn = null, gArrowMode = "end", gLetter = "";
  let gObs = [];   // ResizeObservers on the current card's canvases; dropped at every render so old canvases can't redraw against a cleared state
  const gWatch = (el, fn) => { if (typeof ResizeObserver === "undefined") return; const o = new ResizeObserver(fn); o.observe(el); gObs.push(o); };
  const gUnwatch = () => { gObs.forEach(o => o.disconnect()); gObs = []; };
  const gMode = {};   // results view per question: over | mine | key

  // tiny safe expression parser (no eval): + - * / ^, parentheses, x, pi, e, sin cos tan asin acos atan sqrt cbrt abs exp ln log floor ceil sign, implicit multiplication (2x, 3(x+1))
  function gParse(src){
    const s = String(src).toLowerCase().replace(/\s+/g, "").replace(/^(?:y|f\(x\))=/, "").replace(/[−–—]/g, "-").replace(/[×·]/g, "*").replace(/\*\*/g, "^").replace(/÷/g, "/");
    const T = []; let i = 0, m;
    while (i < s.length){
      const rest = s.slice(i);
      if ((m = /^(?:\d+\.?\d*|\.\d+)/.exec(rest))){ T.push({n: parseFloat(m[0])}); i += m[0].length; }
      else if ((m = /^[a-z]+/.exec(rest))){
        let w = m[0];
        while (w){ const nm = G_NAMES.find(k => w.startsWith(k)); if (!nm) throw 0; T.push({id: nm}); w = w.slice(nm.length); }
        i += m[0].length;
      }
      else if ("+-*/^()".includes(s[i])){ T.push({op: s[i]}); i++; }
      else throw 0;
    }
    let p = 0;
    const bin = (o, a, b) => o === "+" ? x => a(x) + b(x) : o === "-" ? x => a(x) - b(x) : o === "*" ? x => a(x) * b(x) : o === "/" ? x => a(x) / b(x) : x => Math.pow(a(x), b(x));
    const isStart = t => !!t && (t.n !== undefined || !!t.id || t.op === "(");
    const expr = () => { let v = term(); while (T[p] && (T[p].op === "+" || T[p].op === "-")){ const o = T[p++].op; v = bin(o, v, term()); } return v; };
    const term = () => { let v = unary(); for (;;){ const t = T[p]; if (t && (t.op === "*" || t.op === "/")){ p++; v = bin(t.op, v, unary()); } else if (isStart(t)) v = bin("*", v, unary()); else return v; } };
    const unary = () => { const t = T[p]; if (t && t.op === "-"){ p++; const u = unary(); return x => -u(x); } if (t && t.op === "+"){ p++; return unary(); } return pow(); };
    const pow = () => { const b = prim(); if (T[p] && T[p].op === "^"){ p++; return bin("^", b, unary()); } return b; };
    const prim = () => {
      const t = T[p++]; if (!t) throw 0;
      if (t.n !== undefined){ const n = t.n; return () => n; }
      if (t.op === "("){ const v = expr(); if (!T[p] || T[p].op !== ")") throw 0; p++; return v; }
      if (t.id === "x") return x => x;
      if (t.id === "pi") return () => Math.PI;
      if (t.id === "e") return () => Math.E;
      const fn = G_FN[t.id]; if (!fn || !T[p] || T[p].op !== "(") throw 0;
      p++; const a = expr(); if (!T[p] || T[p].op !== ")") throw 0; p++;
      return x => fn(a(x));
    };
    const f = expr(); if (p !== T.length) throw 0;
    return f;
  }
  function gCompile(src){
    const key = String(src);
    if (!gFnCache.has(key)){ let f = null; try { f = gParse(key); } catch (e) { f = null; } gFnCache.set(key, f); }
    return gFnCache.get(key);
  }

  const gN = (v, d) => (v === null || v === undefined || v === "" || typeof v === "boolean" || typeof v === "object" || !Number.isFinite(+v)) ? d : +v;
  const gLab = v => (typeof v === "string" || typeof v === "number") ? String(v).trim().slice(0, 4) : "";   // a point letter (A, B, C…)
  // the point letters a question offers: graph.letters (array, or "A,B,C"), else the labels on its answer dots
  const gLetters = v => { const out = []; (typeof v === "string" ? (/[\s,]/.test(v) ? v.split(/[\s,]+/) : v.split("")) : Array.isArray(v) ? v : []).slice(0, 12).forEach(x => { const l = gLab(x); if (l && !out.includes(l)) out.push(l); }); return out; };
  const gLettersOf = g => g.letters.length ? g.letters : g.answer.dots.map(d => d.label).concat(g.answer.texts.map(t => t.label)).filter((l, i, a) => l && a.indexOf(l) === i);
  function gNice(r){ const raw = r / 8, pw = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / pw; return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * pw; }
  function gShapes(o){
    const out = {curves: [], dots: [], vlines: [], hlines: [], texts: []};
    if (!o || typeof o !== "object") return out;
    (Array.isArray(o.curves) ? o.curves : []).slice(0, 12).forEach(c => {
      if (!c || typeof c !== "object") return;
      const cv = {};
      if (typeof c.fn === "string" && c.fn.trim()){
        cv.fn = c.fn.trim().slice(0, 120);
        if (!gCompile(cv.fn)) cv.bad = true;
        if (Array.isArray(c.domain) && c.domain.length === 2 && c.domain.every(v => gN(v, null) !== null)) cv.domain = [+c.domain[0], +c.domain[1]];
      } else if (Array.isArray(c.points)){
        const pts = c.points.slice(0, 200).filter(q => Array.isArray(q) && q.length >= 2 && gN(q[0], null) !== null && gN(q[1], null) !== null).map(q => [+q[0], +q[1]]);
        if (pts.length < 2) return;
        cv.points = pts;
      } else return;
      if (c.dash) cv.dash = true;
      { const ar = String(c.arrows ?? c.arrow ?? "").toLowerCase(); if (ar === "both" || ar === "start" || ar === "end") cv.arrows = ar; else if (ar === "true" || ar === "1" || ar === "yes") cv.arrows = "end"; }   // arrowheads on the ends of the curve
      if (c.label) cv.label = String(c.label).slice(0, 40);
      out.curves.push(cv);
    });
    (Array.isArray(o.dots) ? o.dots : []).slice(0, 40).forEach(d => { if (d && gN(d.x, null) !== null && gN(d.y, null) !== null){ const dd = {x: +d.x, y: +d.y, open: !!d.open}, lb = gLab(d.label ?? d.name ?? d.letter); if (lb) dd.label = lb; out.dots.push(dd); } });
    (Array.isArray(o.texts) ? o.texts : []).slice(0, 20).forEach(t => { if (t && gN(t.x, null) !== null && gN(t.y, null) !== null){ const lb = gLab(t.label ?? t.text ?? t.name ?? t.letter); if (lb) out.texts.push({x: +t.x, y: +t.y, label: lb}); } });   // plain text, no point
    (Array.isArray(o.vlines) ? o.vlines : []).slice(0, 12).forEach(v => { if (gN(v, null) !== null) out.vlines.push(+v); });
    (Array.isArray(o.hlines) ? o.hlines : []).slice(0, 12).forEach(v => { if (gN(v, null) !== null) out.hlines.push(+v); });
    return out;
  }
  function gClean(g, alt){
    g = g && typeof g === "object" ? g : {};
    let xMin = gN(g.xMin, -10), xMax = gN(g.xMax, 10), yMin = gN(g.yMin, -10), yMax = gN(g.yMax, 10);
    if (!(xMax > xMin)){ xMin = -10; xMax = 10; }
    if (!(yMax > yMin)){ yMin = -10; yMax = 10; }
    const xs = gN(g.xStep, 0), ys = gN(g.yStep, 0);
    return {
      xMin, xMax, yMin, yMax,
      xStep: xs > 0 && (xMax - xMin) / xs <= 50 ? xs : gNice(xMax - xMin),
      yStep: ys > 0 && (yMax - yMin) / ys <= 50 ? ys : gNice(yMax - yMin),
      xLabel: String(g.xLabel ?? "x").slice(0, 24), yLabel: String(g.yLabel ?? "y").slice(0, 24),
      given: gShapes(g.given), answer: gShapes(g.answer && typeof g.answer === "object" ? g.answer : alt),
      letters: gLetters(g.letters ?? g.labels)

  }
  function gDescribe(g){
    const parts = g.answer.curves.map(c => c.fn ? "y = " + c.fn : "line through " + c.points.slice(0, 4).map(p => `(${p[0]}, ${p[1]})`).join(", "));
    g.answer.dots.forEach(d => { if (d.label) parts.push(`${d.label} (${+d.x.toFixed(4)}, ${+d.y.toFixed(4)})`); });
    return parts.length ? parts.join(" ; ") : "See the graph.";
  }
  const gSummary = a => {
    if (!(a && Array.isArray(a.s) && a.s.length)) return "(blank)";
    const at = s => `${s.l} (${+(+s.p[0][0]).toFixed(3)}, ${+(+s.p[0][1]).toFixed(3)})`, ok = s => s && s.l && Array.isArray(s.p) && s.p[0];
    const L = a.s.filter(s => ok(s) && s.t !== "text").map(at), T = a.s.filter(s => ok(s) && s.t === "text").map(at), AR = a.s.filter(s => s && s.ar && Array.isArray(s.p) && s.p.length > 1).length;
    return `Drawn graph · ${a.s.length} mark${a.s.length === 1 ? "" : "s"}${AR ? " · " + AR + " arrow" + (AR === 1 ? "" : "s") : ""}${L.length ? " · lettered points " + L.join(", ") : ""}${T.length ? " · text labels " + T.join(", ") : ""}`;
  };
  const gAR = g => Math.min(1.6, Math.max(1, (g.xMax - g.xMin) / (g.yMax - g.yMin))).toFixed(3);
  const gFmtN = v => String(+v.toFixed(6));

  function gGeom(cv, spec){
    const w = cv.clientWidth, h = cv.clientHeight, L = 40, R = 14, T = 18, B = 32, pw = Math.max(10, w - L - R), ph = Math.max(10, h - T - B);
    const xr = spec.xMax - spec.xMin, yr = spec.yMax - spec.yMin;
    return {w, h, L, R, T, B, pw, ph,
      X: x => L + (x - spec.xMin) / xr * pw, Y: y => T + (1 - (y - spec.yMin) / yr) * ph,
      ix: px => spec.xMin + (px - L) / pw * xr, iy: py => spec.yMin + (1 - (py - T) / ph) * yr};
  }
  function gCurvePath(c, G, spec, cv){
    c.beginPath();
    if (cv.points){ cv.points.forEach((q, i) => i ? c.lineTo(G.X(q[0]), G.Y(q[1])) : c.moveTo(G.X(q[0]), G.Y(q[1]))); return; }
    const f = gCompile(cv.fn); if (!f) return;
    const x0 = Math.max(spec.xMin, cv.domain ? Math.min(cv.domain[0], cv.domain[1]) : -Infinity), x1 = Math.min(spec.xMax, cv.domain ? Math.max(cv.domain[0], cv.domain[1]) : Infinity);
    if (!(x1 >= x0)) return;
    const N = Math.max(2, Math.ceil(G.pw * 2)), jump = (spec.yMax - spec.yMin) * 1.5;
    let pen = false, prev = 0;
    for (let i = 0; i <= N; i++){
      const x = x0 + (x1 - x0) * i / N; let y; try { y = f(x); } catch (e) { y = NaN; }
      if (!Number.isFinite(y) || Math.abs(y) > 1e6){ pen = false; continue; }
      if (pen && Math.abs(y - prev) > jump) pen = false;
      if (!pen){ c.moveTo(G.X(x), G.Y(y)); pen = true; } else c.lineTo(G.X(x), G.Y(y));
      prev = y;
    }
  }
  // a point letter beside a dot; flips to the left or below when the dot is near the edge of the plot
  function gDrawLabel(c, x, y, text, col, G){
    c.save(); c.setLineDash([]); c.globalAlpha = 1;
    c.font = '11px Silkscreen, "Courier New", monospace'; c.textBaseline = "middle";
    const w = c.measureText(text).width, left = !!G && x + 9 + w > G.L + G.pw - 2, below = !!G && y - 13 < G.T + 4;
    c.textAlign = left ? "right" : "left";

    c.lineJoin = "round"; c.lineWidth = 4; c.strokeStyle = G_COL.bg; c.strokeText(text, tx, ty);
    c.fillStyle = col; c.fillText(text, tx, ty);
    c.restore();
  }
  // plain text with no point (an SE or IE tag on an arrow, a letter beside a dot): centred on x,y, nudged inside the plot
  function gDrawText(c, x, y, text, col, G){
    c.save(); c.setLineDash([]); c.globalAlpha = 1;
    c.font = '12px Silkscreen, "Courier New", monospace'; c.textBaseline = "middle"; c.textAlign = "center";
    if (G){ const hw = c.measureText(text).width / 2 + 2; x = Math.min(G.L + G.pw - hw, Math.max(G.L + hw, x)); y = Math.min(G.T + G.ph - 8, Math.max(G.T + 8, y)); }
    c.lineJoin = "round"; c.lineWidth = 4; c.strokeStyle = G_COL.bg; c.strokeText(text, x, y);
    c.fillStyle = col; c.fillText(text, x, y);
    c.restore();
  }
  function gDrawDot(c, x, y, col, open, label, G){
    c.beginPath(); c.arc(x, y, 4.5, 0, Math.PI * 2);
    if (open){ c.fillStyle = G_COL.bg; c.fill(); c.strokeStyle = col; c.lineWidth = 2; c.setLineDash([]); c.stroke(); }
    else { c.fillStyle = col; c.fill(); }
    if (label) gDrawLabel(c, x, y, label, col, G);
  }
  // the answer key: a soft wide band under a crisp line, so you can see how close your drawing came
  function gDrawShapes(c, G, spec, sh, col, band){
    c.lineCap = "round"; c.lineJoin = "round"; c.strokeStyle = col;
    c.setLineDash([6, 5]); c.lineWidth = 1.5; c.globalAlpha = .75;
    sh.vlines.forEach(v => { const x = Math.round(G.X(v)) + .5; c.beginPath(); c.moveTo(x, G.T); c.lineTo(x, G.T + G.ph); c.stroke(); });
    sh.hlines.forEach(v => { const y = Math.round(G.Y(v)) + .5; c.beginPath(); c.moveTo(G.L, y); c.lineTo(G.L + G.pw, y); c.stroke(); });
    c.globalAlpha = 1;
    sh.curves.forEach(cv => {
      c.setLineDash(cv.dash ? [8, 6] : []);
      if (band){ c.lineWidth = 9; c.globalAlpha = .26; gCurvePath(c, G, spec, cv); c.stroke(); }
      c.lineWidth = 2.5; c.globalAlpha = .95; gCurvePath(c, G, spec, cv); c.stroke();
    });
    c.globalAlpha = 1; c.setLineDash([]);
    sh.dots.forEach(d => gDrawDot(c, G.X(d.x), G.Y(d.y), col, d.open, d.label, G));
    (sh.texts || []).forEach(t => gDrawText(c, G.X(t.x), G.Y(t.y), t.label, col, G));
  }
  // lines and curves are smooth splines through their points (two points stay a straight line)
  const gSmooth = s => s.t === "line" || s.t === "curve";
  const gSpline = q => {
    const n = q.length, o = [];

  /* ---------------- missed pile → db ----------------

  const cardId = it => { const s = norm(it.prompt) + "|" + it.type; let x = 5381; for (let i = 0; i < s.length; i++) x = ((x * 33) ^ s.charCodeAt(i)) >>> 0; return x.toString(36); };

  /* small shared bits: dropdowns and ? popovers (open/close in place, no re-render) */
  const ddHtml = (key, label, opts, val) => `<div class="dd" data-dd="${key}"><button class="spill dd-b" aria-haspopup="listbox" aria-expanded="false"><span class="dd-l">${label}</span><b>${esc((opts.find(o => o[0] === val) || opts[0])[1])}</b><svg viewBox="0 0 5 3" fill="currentColor" aria-hidden="true"><path d="M0 0h5v1H0z M1 1h3v1H1z M2 2h1v1H2z"/></svg></button><div class="dd-m" role="listbox" hidden>${opts.map(([v, l]) => `<button class="dd-o ${v === val ? "on" : ""}" role="option" aria-selected="${v === val}" data-ddv="${esc(v)}">${esc(l)}</button>`).join("")}</div></div>`;
  const helpHtml = (label, body) => `<span class="hlp"><button class="hlp-b" aria-expanded="false" aria-label="${esc(label)}" title="${esc(label)}">?</button><span class="hlp-p" role="note" hidden>${body}</span></span>`;
  function closePops(except){ document.querySelectorAll(".dd-m:not([hidden]), .hlp-p:not([hidden])").forEach(m => { if (m === except) return; m.hidden = true; const b = m.previousElementSibling; if (b) b.setAttribute("aria-expanded", "false"); }); }
  document.addEventListener("click", e => { if (!e.target.closest(".dd, .hlp")) closePops(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && document.querySelector(".dd-m:not([hidden]), .hlp-p:not([hidden])")){ e.preventDefault(); e.stopPropagation(); closePops(); } }, true);
  function wirePops(root, onPick){
    root.querySelectorAll(".dd-b, .hlp-b").forEach(b => b.onclick = e => { e.stopPropagation(); const m = b.nextElementSibling, open = m.hidden; closePops(m); m.hidden = !open; b.setAttribute("aria-expanded", String(open)); });
    root.querySelectorAll(".dd").forEach(d => d.querySelectorAll("[data-ddv]").forEach(o => o.onclick = e => { e.stopPropagation(); closePops(); onPick(d.dataset.dd, o.dataset.ddv); }));
  }

  let pieSeq = 0;
  /* donut: parts [{n, c, l}], center text; thin surface gap between slices */
  function pieSvg(parts, center, sub, aria){
    const P = parts.filter(p => p.n > 0), tot = P.reduce((s, p) => s + p.n, 0);
    if (!tot) return "";
    const S = 120, cx = 60, cy = 60, R = 54, r = 33;
    let a0 = -Math.PI / 2, arcs = "";
    const mid = "pm" + (++pieSeq);
    const pt = (rad, a) => (cx + rad * Math.cos(a)).toFixed(2) + " " + (cy + rad * Math.sin(a)).toFixed(2);
    P.forEach(p => {
      const tip = `<title>${esc(p.l)}: ${p.n} (${pct(p.n, tot)}%)</title>`;
      if (P.length === 1){ arcs += `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" stroke="${p.c}" stroke-width="${R - r}">${tip}</circle>`; return; }
      const a1 = a0 + p.n / tot * Math.PI * 2, big = a1 - a0 > Math.PI ? 1 : 0;
      arcs += `<path class="pie-s" d="M${pt(R, a0)}A${R} ${R} 0 ${big} 1 ${pt(R, a1)}L${pt(r, a1)}A${r} ${r} 0 ${big} 0 ${pt(r, a0)}Z" fill="${p.c}">${tip}</path>`;
      a0 = a1;
    });
    arcs = `<defs><mask id="${mid}" maskUnits="userSpaceOnUse" x="0" y="0" width="${S}" height="${S}"><circle cx="${cx}" cy="${cy}" r="30" fill="none" stroke="#fff" stroke-width="64" pathLength="100" transform="rotate(-90 ${cx} ${cy})"/></mask></defs><g mask="url(#${mid})">${arcs}</g>`;
    const leg = P.map(p => `<span><i style="background:${p.c}"></i><em>${esc(p.l)}</em><b data-pct="${pct(p.n, tot)}%" data-frac="${p.n}">${statsFmt === "pct" ? pct(p.n, tot) + "%" : p.n}</b></span>`).join("");
    return `<div class="st-pie"><svg class="pie" viewBox="0 0 ${S} ${S}" role="img" aria-label="${esc(aria)}">${arcs}<text class="pie-c" x="${cx}" y="${cy + (sub ? 2 : 5)}" text-anchor="middle">${center}</text>${sub ? `<text class="pie-u" x="${cx}" y="${cy + 15}" text-anchor="middle">${sub}</text>` : ""}</svg><div class="pie-leg">${leg}</div></div>`;
  }

  /* accuracy per quiz, placed on a real time axis (when each quiz was submitted) */
  function trendSvg(rows){
    if (rows.length < 2) return `<div class="note">Finish two or more quizzes in this range to see a trend.</div>`;
    const W = 640, H = 214, L = 30, R = 10, T = 12, B = 42, pw = W - L - R, ph = H - T - B;
    const minP = Math.min(...rows.map(r => (r.score || 0) / r.total)), lo = Math.min(.7, Math.max(0, Math.floor((minP - .08) * 10) / 10));
    const ts = rows.map(r => Date.parse(r.finishedAt));
    let t0 = Math.min(...ts), t1 = Math.max(...ts);
    if (t1 - t0 < 36e5){ const m = (t0 + t1) / 2; t0 = m - 18e5; t1 = m + 18e5; }
    const pad = (t1 - t0) * .04; t0 -= pad; t1 += pad;
    const x = t => L + (t - t0) / (t1 - t0) * pw, y = p => T + (1 - (p - lo) / (1 - lo)) * ph;
    const pts = rows.map((r, i) => ({ i, t: ts[i], p: (r.score || 0) / r.total, r }));
    // rolling 3-quiz average (pooled), recomputed only at 3-hour steps aligned to the local clock

  /* ---------------- grades from Claude ----------------

       items:[{n, verdict:"got"|"partly"|"missed", met:[bool per rubric bullet], note}]}

     short answers and FRQs once per gradedAt (ticks the rubric, sets I got it / Missed it, shows the note), then syncs results

  let gradesSub = { key: null, off: null };

  function watchGrades(){

    if (gradesSub.off) try { gradesSub.off(); } catch {}
    gradesSub = { key, off: null };
    try {
      const off = db.doc("grades/" + key).onSnapshot(snap => {
        const ex = typeof snap.exists === "function" ? snap.exists() : snap.exists;

  function applyGrades(){

    const g = gradesDoc[safeId(quiz.id)]; if (!g || !Array.isArray(g.items)) return false;
    const same = g.finishedAt ? Date.parse(g.finishedAt) === Date.parse(st.revealedAt) : Date.parse(g.gradedAt) > Date.parse(st.revealedAt);
    if (!same) return false;                                            // graded a different attempt
    const stamp = String(g.gradedAt || JSON.stringify(g.items));
    if (st.gradedAt === stamp) return false;                            // already applied (he may have changed marks since)
    st.gradedAt = stamp; if (!Array.isArray(st.cnote)) st.cnote = [];
    g.items.forEach(x => {
      if (!x) return; const k = Math.round(+x.n) - 1, q = quiz.questions[k]; if (!q || isDrop(st, k) || (q.type !== "short" && q.type !== "frq")) return;
      const v = String(x.verdict || "").toLowerCase();
      if (q.type === "frq" && Array.isArray(x.met) && q.rubric.length){ st.rub[k] = q.rubric.map((_, j) => !!x.met[j]); st.self[k] = rubGot(k) >= rubMax(q.rubric) * RUB_PASS; }
      else if (/^(got|right|correct|met|yes)/.test(v)) st.self[k] = true;
      else if (v) st.self[k] = false;                                   // partly / missed both stay in the missed pile
      if (x.note) st.cnote[k] = String(x.note).slice(0, 500);
    });
    return true;
  }

  function renderResults(){
    if (applyGrades()){ save(); syncSoon(); }
    const t = tally();
    const missed = quiz.questions.map((_, k) => k).filter(k => !isDrop(st, k) && isRight(k) === false);
    const first = justRevealed; justRevealed = false;
    const blind = quiz.questions.filter((_, k) => !isDrop(st, k) && st.conf[k] === 3 && isRight(k) === false).length;
    const okey = quiz.id + "|" + st.revealedAt;
    if (first || !resOrder || resOrderKey !== okey){
      const all = quiz.questions.map((_, k) => k);
      resOrder = all.filter(k => !isDrop(st, k) && isRight(k) !== true).concat(all.filter(k => !isDrop(st, k) && isRight(k) === true), all.filter(k => isDrop(st, k)));
      resOrderKey = okey;
    }
    const shortIdx = quiz.questions.map((q, k) => (q.type === "short" || q.type === "frq") && !isDrop(st, k) ? k : -1).filter(k => k >= 0);
    const hasFrq = quiz.questions.some((q, k) => q.type === "frq" && !isDrop(st, k));
    const nDrop = quiz.questions.filter((_, k) => isDrop(st, k)).length;
    if (hasFrq) loadClassRubric(quiz.subject);
    stage.innerHTML = `
      <section class="card wide resv">
        <div class="eyebrow" style="--sc:${subjColor(subjKey(quiz.subject))}"><span class="sj">${esc(quiz.subject)}</span> · ${esc(quiz.title)}</div>
        <div class="row" style="align-items:flex-end;margin-top:12px">
          <div><div class="score"><span id="scoreN">${t.right}</span><small>/${t.total}</small></div>
            <div class="xp ${first && !reducedMotion() ? "fill" : ""}">${quiz.questions.map((_, k) => { const r = isRight(k); return `<i class="${isDrop(st, k) ? "drop" : r === true ? "ok" : r === false ? "no" : "pend"}" style="--n:${k}"></i>`; }).join("")}</div></div>
          <span class="spacer"></span>
          <p class="lede" style="text-align:right"><span class="px" style="color:var(--ink);font-size:13px">${HOURGLASS}Time ${fmtT(totalMs(st))}</span><br>${t.pend ? `${t.pend} written answer${t.pend > 1 ? "s" : ""} to check yourself.<br>` : ""}${nDrop ? `${nDrop} question${nDrop > 1 ? "s" : ""} dropped.<br>` : ""}${blind ? `${blind} sure but wrong.<br>` : ""}${scoreLine(t)}</p>
        </div>
        ${shortIdx.length ? `<div class="gradebar"><span class="gb-t">${t.pend ? "Written answers to grade. Tell Claude “grade my quiz” and the marks fill in here, or copy a prompt." : "Graded. Tell Claude “grade my quiz” again any time, or copy a prompt."}</span><button class="btn" id="copyGrade">Copy prompt</button></div>` : ""}
        ${hasFrq ? `<div id="crub"></div>` : ""}
        <div class="res-list">${resOrder.map(k => {
          const q = quiz.questions[k];
          const r = isRight(k);
          const you = answerText(k, st.answers[k]);
          const right = q.type === "mc" ? `${LETTERS[q.answer]}. ${q.choices[q.answer]}` : q.answer;
          const cls = r === true ? "ok" : r === false ? "no" : "pending";
          const mark = r === true ? "Correct" : r === false ? "Missed" : "Check";
          const gq = q.type === "graph";
          const dlH = `<dl class="ans">
              <dt>You</dt><dd class="you ${r === true ? "ok" : r === false ? "no" : ""}">${you ? fmt(you) : "<em>left blank</em>"}</dd>
              ${(r === true && q.type === "mc") || (q.type === "frq" && !String(q.answer).trim()) ? "" : `<dt>${q.type === "frq" ? "Key points" : "Answer"}</dt><dd class="right">${fmt(right)}</dd>`}
              ${st.conf[k] ? `<dt>Sure?</dt><dd class="conf ${r === false && st.conf[k] === 3 ? "flag" : ""}">${CONF_NAME[st.conf[k]]}${r === false && st.conf[k] === 3 ? " · blind spot" : r === true && st.conf[k] === 1 ? " · lucky, shaky" : ""}</dd>` : ""}
            </dl>`;
          const noteH = st.cnote && st.cnote[k] && (q.type === "short" || q.type === "frq") ? `<div class="cnote"><span class="cn-k">Claude</span><span class="cn-t">${fmt(st.cnote[k])}</span></div>` : "";
          const whyH = q.explanation ? (r === true ? `<details class="res-more"><summary>Explanation</summary><div class="why">${fmt(q.explanation)}</div></details>` : `<div class="why">${fmt(q.explanation)}</div>`) : "";
          const rubH = q.type === "frq" && q.rubric && q.rubric.length ? (() => {
            const tot = rubMax(q.rubric), got = rubGot(k), tk = st.rub[k] || [], touched = tk.some(Boolean), pass = got >= tot * RUB_PASS;
            return `<div class="rub"><div class="rub-h">What graders look for<span class="rub-pts ${touched ? (pass ? "pass" : "fail") : ""}">${touched ? `${Math.round(got * 100) / 100}/${Math.round(tot * 100) / 100} pts` : ptsTxt(tot)}</span></div>
              ${q.rubric.map((x, j) => `<label class="rub-i ${tk[j] ? "met" : ""}"><input type="checkbox" data-rub="${k}" data-j="${j}" ${tk[j] ? "checked" : ""}><span>${fmt(x.text)}</span><span class="rp">${ptsTxt(x.pts)}</span></label>`).join("")}
              <div class="rub-n">Tick what your response did. ${Math.round(RUB_PASS * 100)}% of the points counts as right.</div></div>`;
          })() : "";
          const selfH = q.type === "short" || q.type === "frq" || gq ? `<div class="self">Grade yourself:
                <button class="pill ok ${st.self[k] === true ? "on" : ""}" data-self="${k}" data-v="1">${gq ? "Good" : "I got it"}</button>
                <button class="pill no ${st.self[k] === false ? "on" : ""}" data-self="${k}" data-v="0">${gq ? "Bad" : "Missed it"}</button></div>` : "";
          if (isDrop(st, k)) return `<article class="res dropped" data-k="${k}">
            <div class="res-top" title="Right-click to restore this question"><span class="res-n">${String(k + 1).padStart(2, "0")}</span><div class="res-q">${fmt(q.prompt)}</div><span class="res-mark">Dropped</span></div>
            <div class="self"><button class="pill" data-restore="${k}">Restore</button></div>
          </article>`;
          return `<article class="res ${cls}${r === true ? " quiet" : ""}" data-k="${k}">
            <div class="res-top" title="Right-click to drop this question"><span class="res-n">${String(k + 1).padStart(2, "0")}</span><div class="res-q">${fmt(q.prompt)}${tblHtml(q.table)}</div><span class="res-mark">${HOURGLASS}${fmtT(st.times[k] || 0)} · ${mark}${st.flags[k] ? " · ⚑" : ""}</span></div>
            ${gq ? gResHtml(k, dlH + whyH + selfH) : dlH + noteH + rubH + whyH + selfH}
          </article>`;
        }).join("")}</div>
        <div class="row">
          <button class="btn" id="copy">Copy results for Claude</button>
          ${missed.length ? `<button class="btn ghost" id="retryMissed">Retry the ${missed.length} missed</button>` : ""}
          <span class="spacer"></span>
          <button class="btn ghost" id="retake">Retake all</button>
        </div>
        <p class="note" id="copyNote">${db ? "Your results are saved, so you can just tell Claude “check my quiz results.”" : ""}</p>
      </section>`;
    if (first) countUp($("#scoreN"), t.right);
    gMountRes();
    stage.querySelectorAll(".res[data-k]").forEach(a => a.oncontextmenu = e => {   // right-click a question to drop it (or restore it)
      if (e.target.closest("input, textarea")) return;
      e.preventDefault();
      const k = +a.dataset.k, was = isDrop(st, k);
      openMenu(e.clientX, e.clientY, `<button class="cm-i ${was ? "" : "dang"}" data-a="drop">${was ? "Restore question" : "Drop question"}</button>`, m => act(m, '[data-a="drop"]', () => dropQuestion(k, !was)));
    });
    stage.querySelectorAll("[data-restore]").forEach(b => b.onclick = () => dropQuestion(+b.dataset.restore, false));
    paintClassRubric();
    watchGrades();
    stage.querySelectorAll("[data-rub]").forEach(b => b.onchange = () => {
      const k = +b.dataset.rub, j = +b.dataset.j, it = quiz.questions[k];
      const tk = st.rub[k] = (st.rub[k] || []).slice(); while (tk.length < it.rubric.length) tk.push(false);
      tk[j] = b.checked;
      st.self[k] = tk.some(Boolean) ? rubGot(k) >= rubMax(it.rubric) * RUB_PASS : null;   // ticking grades it; the pills still override
      save(); rerenderResults(); syncSoon();
    });
    stage.querySelectorAll("[data-self]").forEach(b => b.onclick = () => {
      const k = +b.dataset.self, v = b.dataset.v === "1";
      st.self[k] = st.self[k] === v ? null : v; save(); rerenderResults(); syncSoon();
    });
    $("#copy").onclick = async () => {
      try { await navigator.clipboard.writeText(resultsText()); $("#copyNote").textContent = "Copied. Paste it into your chat with Claude."; }
      catch { $("#copyNote").textContent = "Couldn't copy here. Just tell Claude “check my quiz results.”"; }
    };
    const cg = $("#copyGrade");
    if (cg) cg.onclick = async () => {
      try { await navigator.clipboard.writeText(gradePromptText()); cg.textContent = "Copied!"; $("#copyNote").textContent = "Copied. Paste it into your chat with Claude."; }
      catch { $("#copyNote").textContent = "Couldn't copy here. Just tell Claude “grade my short answers.”"; }
      setTimeout(() => { if (cg.isConnected) cg.textContent = "Copy prompt"; }, 1500);
    };
    const rm = $("#retryMissed");
    if (rm) rm.onclick = () => {
      const sub = { id: quiz.id + "-retry-" + Date.now().toString(36), title: quiz.title + " · missed", topic: quiz.topic, subject: quiz.subject, local: true, questions: missed.map(k => quiz.questions[k]) };
      adopt(validQuiz(sub), {fresh:true});
    };
    $("#retake").onclick = () => { flushSync(); st = blankState(quiz); save(); render(); };
  }
  function dropQuestion(k, v){
    if (!st || !Array.isArray(st.dropped)) return;
    st.dropped[k] = !!v; save(); rerenderResults(); syncSoon();
  }
  // Esc closes an open right-click menu instead of leaving the quiz
  document.addEventListener("keydown", e => { if (e.key === "Escape" && cmenu && quiz){ e.preventDefault(); e.stopImmediatePropagation(); closeMenu(); } }, true);
  function rerenderResults(){
    const sl = stage.querySelector(".res-list"), cd = stage.querySelector(".card.resv"), a = sl ? sl.scrollTop : 0, b = cd ? cd.scrollTop : 0;
    renderResults();
    const nl = stage.querySelector(".res-list"), nc = stage.querySelector(".card.resv");
    if (nl) nl.scrollTop = a; if (nc) nc.scrollTop = b;
  }
  function gradePromptText(){
    const frq = quiz.questions.some(q => q.type === "frq");
    const lines = [`Please grade my written answers from the quiz "${quiz.title}". For a short answer, compare my answer to the reference answer and judge meaning, not exact wording. For a free response, grade it against its rubric: for each bullet say Met, Partly, or Not met with one line of evidence from my response, then total the points. Don't write a sample or model response. Say Got it, Partly, or Missed it, give a one or two sentence reason, and point out anything I left out or got wrong. Be honest and don't round up. At the end, tell me which ones to mark "I got it" and which "Missed it".`, ""];
    const cr = frq ? classRub[subjKey(quiz.subject)] : null;
    if (cr){ lines.push(`Class rubric (${cr.subject}):`, cr.markdown.trim(), ""); }
    quiz.questions.forEach((q, k) => {
      if ((q.type !== "short" && q.type !== "frq") || isDrop(st, k)) return;
      lines.push(`Q${k + 1}. ${q.prompt}${q.type === "frq" && q.points ? ` (${ptsTxt(q.points)})` : ""}`);
      tblText(q.table).forEach(t => lines.push(t));
      lines.push(`My answer: ${answerText(k, st.answers[k]) ?? "(left blank)"}`);
      if (q.type === "frq"){
        q.rubric.forEach(x => lines.push(`Rubric: ${x.text} (${ptsTxt(x.pts)})`));
        if (String(q.answer).trim()) lines.push(`Key points: ${q.answer}`);
      } else lines.push(`Reference answer: ${q.answer}`);
      if (q.explanation) lines.push(`Explanation: ${q.explanation}`);
      lines.push("");
    });
    return lines.join("\n").trim();
  }
  function scoreLine(t){
    if (!t.total) return "Every question was dropped.";
    const p = t.right / t.total;
    if (p === 1) return "Clear mind, every one.";
    if (p >= .8) return "Steady. A few to revisit.";
    if (p >= .5) return "Halfway there. Look at the misses.";
    return "Good place to start. Read the why for each.";
  }
  function resultsText(){
    const t = tally();
    const lines = [`Quiz results: ${quiz.title} (${t.right}/${t.total}) · time ${fmtT(totalMs(st))}`];
    quiz.questions.forEach((q, k) => {
      if (isDrop(st, k)) return;
      const r = isRight(k);
      lines.push(`${k + 1}. [${r === true ? "✓" : r === false ? "✗" : "?"}${st.flags[k] ? " flagged" : ""}${st.conf && st.conf[k] ? " · " + CONF_NAME[st.conf[k]] : ""}] ${q.prompt}`);
      tblText(q.table).forEach(t => lines.push(t));
      lines.push(`   Me: ${answerText(k, st.answers[k]) ?? "(blank)"}`);
      if (q.type === "frq" && q.rubric.length){
        const tk = st.rub[k] || [];
        lines.push(`   Rubric ${Math.round(rubGot(k) * 100) / 100}/${Math.round(rubMax(q.rubric) * 100) / 100} pts · met: ${q.rubric.filter((_, j) => tk[j]).map(x => x.text).join("; ") || "none"} · missed: ${q.rubric.filter((_, j) => !tk[j]).map(x => x.text).join("; ") || "none"}`);
      }
      if (r !== true && !(q.type === "frq" && !String(q.answer).trim())) lines.push(`   Answer: ${q.type === "mc" ? `${LETTERS[q.answer]}. ${q.choices[q.answer]}` : q.answer}`);
    });
    const nd = quiz.questions.filter((_, k) => isDrop(st, k)).length;
    if (nd) lines.push("", `Dropped ${nd} question${nd > 1 ? "s" : ""} (Q${quiz.questions.map((_, k) => k).filter(k => isDrop(st, k)).map(k => k + 1).join(", Q")}), not scored.`);
    // confidence summary, when ratings were on: what he was unsure or guessing on, and what he was sure about but got wrong
    const rated = quiz.questions.map((_, k) => k).filter(k => st.conf && st.conf[k] && !isDrop(st, k));
    if (rated.length){
      const grp = n => rated.filter(k => CONF_NAME[st.conf[k]] === n);
      const verdict = k => isRight(k) === true ? "right" : isRight(k) === false ? "wrong" : "unchecked";
      const part = n => { const g = grp(n); return g.length ? `${n} ${g.filter(k => isRight(k) === true).length}/${g.length} right` : null; };
      lines.push("", "Confidence: " + ["sure", "unsure", "guess"].map(part).filter(Boolean).join(" · "));
      const blind = grp("sure").filter(k => isRight(k) === false);
      if (blind.length) lines.push("Blind spots (sure but wrong): " + blind.map(k => "Q" + (k + 1)).join(", "));
      const shaky = rated.filter(k => st.conf[k] !== 3);
      if (shaky.length) lines.push("Unsure or guessing on: " + shaky.map(k => `Q${k + 1} (${CONF_NAME[st.conf[k]]}, ${verdict(k)})`).join(", "));
    }
    return lines.join("\n");
  }

  /* ---------------- keyboard ---------------- */
  document.addEventListener("keydown", e => {
    if (!quiz || !st) return;
    if (e.target && e.target.closest && e.target.closest("#calc")) { if (e.key === "Escape") { e.preventDefault(); setCalc(false); } return; }
    if (e.key === "Escape") { e.preventDefault(); toHub(); return; }
    const inText = e.target && (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT");
    if (st.view === "intro" && e.key === "Enter") { $("#begin")?.click(); return; }
    if (st.view === "review" && e.key === "Enter" && !inText) { reveal(); return; }
    if (st.view !== "question") return;
    const q = quiz.questions[st.i];
    if (inText){
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $("#next").click(); }
      return;
    }
    if (q.type === "mc" && !e.metaKey && !e.ctrlKey && !e.altKey){
      const key = e.key.length === 1 ? e.key.toUpperCase() : "";
      let j = key ? LETTERS.indexOf(key) : -1;
      if (j < 0) { const d = /^(?:Digit|Numpad)([1-8])$/.exec(e.code || ""); if (d) j = +d[1] - 1; }
      if (j >= 0 && j < q.choices.length) {
        if (e.shiftKey) toggleCross(st.i, j);
        else if (!(st.cross[st.i] || []).includes(j)) { st.answers[st.i] = j; save(); paintQuestion(st.i); }
        return;
      }
    }
    if (e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); $("#next").click(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(st.i - 1); }
    else if (e.key.toLowerCase() === "t") toggleClock();
    else if (e.key.toLowerCase() === "f") toggleFlag(st.i);
  });

  /* corner brackets on every card */
  new MutationObserver(() => { const fx = stage.dataset.fx; let any = false; stage.querySelectorAll(".card:not([data-c])").forEach(c => { any = true; c.dataset.c = 1; c.insertAdjacentHTML("afterbegin", '<i class="c3"></i><i class="c4"></i>'); if (fx) c.classList.add(fx); }); if (any) stage.dataset.fx = ""; })
    .observe(stage, {childList:true, subtree:true});

  /* ---------------- boot ---------------- */
  let dbChecked = false;
  let tickN = 0;
  setInterval(() => { addTime(); if (st && (st.view === "question" || st.view === "review") && ++tickN % 5 === 0) save(); updateClock(); tickLocks(); }, 1000);
  addEventListener("pagehide", () => { addTime(); save(); flushSync(); });
  // countdowns on scheduled quizzes in the library: update the text in place, re-render once when one opens
  function tickLocks(){
    if (quiz) return;
    const els = stage.querySelectorAll("[data-unlock]"); if (!els.length) return;
    const now = Date.now(); let opened = false;
    els.forEach(el => { const ms = Date.parse(el.dataset.unlock) - now; if (ms <= 0) opened = true; else el.textContent = fmtT(Math.ceil(ms / 1000) * 1000); });
    if (opened && palOpen === null) render();
  }
  document.addEventListener("visibilitychange", () => { if (document.hidden){ addTime(); save(); flushSync(); } else lastTick = Date.now(); });
  render();
  loadPhotos();
  setTimeout(checkUpdates, 1500);   // after boot settles; one check per page load

  (async () => {
    try { db = window.claude && typeof window.claude.use === "function" ? await window.claude.use("db") : null; }
    catch { db = null; }
    dbChecked = true;
    if (!db) { booting = false; startedUp = true; render(); return; }
    const force = setTimeout(() => maybeStart(true), 4000);   // don't wait forever on a slow connection
    const fail = () => { clearTimeout(force); maybeStart(true); };
    db.collection("quizzes").orderBy("createdAt", "desc").limit(300).onSnapshot(onLibrary, fail);
    db.collection("results").limit(300).onSnapshot(onResults, fail);
    try { db.doc("meta/subjects").onSnapshot(onMeta, () => {}); } catch {}
    try { db.doc("meta/folders").onSnapshot(onFolders, () => {}); } catch {}
  })();
})();
</script>
</body>
</html>
